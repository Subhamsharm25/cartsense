<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cartsense</title>
<style>
  :root { --green:#0c831f; --bg:#f4f6f8; --card:#fff; --ink:#1c1c1c; --muted:#666; --accent:#f8cb46; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:90px; }
  header { position:sticky; top:0; z-index:5; background:var(--green); color:#fff; padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:20px; letter-spacing:.5px; }
  header .eta { background:rgba(255,255,255,.15); border-radius:8px; padding:4px 10px; font-size:12px; }
  header select { margin-left:auto; border:0; border-radius:8px; padding:6px 10px; font-size:14px; }
  header input { flex:1 1 160px; min-width:140px; border:0; border-radius:8px; padding:8px 12px; font-size:14px; }
  main { max-width:1080px; margin:0 auto; padding:16px; }
  h2 { font-size:16px; margin:18px 0 10px; }
  h2 small { color:var(--muted); font-weight:normal; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:4px 0 8px; }
  .chips button { border:1px solid #ddd; background:#fff; border-radius:16px; padding:6px 14px; font-size:13px; white-space:nowrap; cursor:pointer; }
  .chips button.on { background:var(--green); color:#fff; border-color:var(--green); }
  .rail { display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .card { background:var(--card); border-radius:12px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); display:flex; flex-direction:column; gap:6px; min-width:170px; }
  .card .em { font-size:34px; }
  .card .nm { font-size:14px; font-weight:600; }
  .card .un { font-size:12px; color:var(--muted); }
  .card .pr { font-weight:700; }
  .card .why { font-size:11px; background:#fff8e1; border-left:3px solid var(--accent); padding:5px 7px; border-radius:4px; color:#6b5900; }
  .card button { margin-top:auto; border:1px solid var(--green); color:var(--green); background:#fff; border-radius:8px; padding:7px; font-weight:700; cursor:pointer; }
  .card button:hover { background:var(--green); color:#fff; }
  #cartbar { position:fixed; bottom:0; left:0; right:0; background:var(--green); color:#fff; display:flex; align-items:center; gap:14px; padding:12px 18px; cursor:pointer; }
  #cartbar b { margin-left:auto; }
  #drawer { position:fixed; bottom:0; right:0; width:min(420px,100%); max-height:75vh; overflow:auto; background:#fff; border-radius:14px 14px 0 0; box-shadow:0 -4px 24px rgba(0,0,0,.25); padding:16px; display:none; z-index:10; }
  #drawer.open { display:block; }
  .ci { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #eee; font-size:14px; }
  .ci button { border:1px solid #ddd; background:#fff; border-radius:6px; width:26px; height:26px; cursor:pointer; }
  .sug { background:#f0f7f1; border-radius:10px; padding:10px; margin:10px 0; font-size:13px; }
  .sug .s { display:flex; align-items:center; gap:8px; padding:6px 0; }
  .sug button { margin-left:auto; border:1px solid var(--green); color:var(--green); background:#fff; border-radius:6px; padding:4px 10px; cursor:pointer; }
  #checkout { width:100%; background:var(--green); color:#fff; border:0; border-radius:10px; padding:13px; font-size:16px; font-weight:700; cursor:pointer; margin-top:12px; }
  #toast { position:fixed; top:70px; left:50%; transform:translateX(-50%); background:#1c1c1c; color:#fff; padding:10px 18px; border-radius:10px; display:none; z-index:20; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>⚡ cartsense</h1>
  <span class="eta">delivery in minutes — demo</span>
  <input id="q" placeholder="Search milk, bread, chips…">
  <select id="user"></select>
</header>
<main>
  <h2 id="senseTitle">🧠 For you, right now <small>— sensed from your own rhythm, with reasons</small></h2>
  <div class="rail" id="foryou"></div>
  <h2>Browse</h2>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>
<div id="cartbar"><span>🛒 <span id="cn">0</span> items</span><span id="hint"></span><b>₹<span id="ct">0</span> · View cart ▸</b></div>
<div id="drawer">
  <h2>Your cart</h2>
  <div id="citems"></div>
  <div class="sug" id="sug" style="display:none"><b>Goes well with your cart</b><div id="sugItems"></div></div>
  <button id="checkout">Place order</button>
</div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let uid=1, cat="";
const api=(p,o)=>fetch(p,o).then(r=>{if(!r.ok)throw r;return r.json()});
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2600)};

function pcard(p, why, btn){
  return `<div class="card"><div class="em">${p.emoji}</div><div class="nm">${p.name}</div>
  <div class="un">${p.unit} · ${p.category}</div><div class="pr">₹${p.price}</div>
  ${why?`<div class="why">${why}</div>`:""}
  <button onclick="add(${p.id})">${btn||"ADD"}</button></div>`;
}
async function loadUsers(){
  const us=await api("/api/users");
  $("#user").innerHTML=us.map(u=>`<option value="${u.id}">${u.name} · ${u.persona}</option>`).join("");
  $("#user").value=uid;
}
async function loadForYou(){
  const d=await api(`/api/foryou?user_id=${uid}`);
  $("#senseTitle").innerHTML=`🧠 For you this ${d.bucket} <small>— sensed from your own rhythm, with reasons</small>`;
  $("#foryou").innerHTML=d.items.length?d.items.map(i=>pcard(i.product,i.reasons[0],"ADD")).join(""):"<p style='color:#666'>Not enough history yet — shop a little and I'll learn your rhythm.</p>";
}
async function loadChips(){
  const cs=await api("/api/categories");
  $("#chips").innerHTML=[`<button class="${cat?"":"on"}" onclick="setCat('')">All</button>`]
    .concat(cs.map(c=>`<button class="${cat===c?"on":""}" onclick="setCat('${c}')">${c}</button>`)).join("");
}
async function loadGrid(){
  const q=$("#q").value.trim();
  const ps=await api(`/api/products?category=${encodeURIComponent(cat)}&q=${encodeURIComponent(q)}`);
  $("#grid").innerHTML=ps.map(p=>pcard(p)).join("");
}
function setCat(c){cat=c;loadChips();loadGrid();}
async function refreshCart(){
  const c=await api(`/api/cart?user_id=${uid}`);
  $("#cn").textContent=c.items.reduce((a,i)=>a+i.qty,0);
  $("#ct").textContent=c.total;
  $("#citems").innerHTML=c.items.length?c.items.map(i=>
    `<div class="ci"><span>${i.emoji}</span><span>${i.name} × ${i.qty}</span>
     <span style="margin-left:auto">₹${(i.price*i.qty).toFixed(0)}</span>
     <button onclick="rem(${i.id})">−</button></div>`).join(""):"<p style='color:#666'>Cart is empty.</p>";
  const sug=await api(`/api/cart/suggest?user_id=${uid}`);
  $("#sug").style.display=sug.length?"block":"none";
  $("#sugItems").innerHTML=sug.map(s=>
    `<div class="s">${s.product.emoji} ${s.product.name} <small style="color:#555">${s.reason}</small>
     <button onclick="add(${s.product.id})">+ Add</button></div>`).join("");
}
async function add(id){await api("/api/cart/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:uid,product_id:id,qty:1})});toast("Added to cart");refreshCart();}
async function rem(id){await api("/api/cart/remove",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:uid,product_id:id})});refreshCart();}
$("#cartbar").onclick=()=>$("#drawer").classList.toggle("open");
$("#checkout").onclick=async()=>{
  try{const o=await api("/api/checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:uid})});
    toast(`Order #${o.order_id} placed — arriving in ~${o.eta_minutes} min (simulated)`);
    $("#drawer").classList.remove("open");refreshCart();loadForYou();
  }catch(e){toast("Cart is empty");}
};
$("#user").onchange=e=>{uid=+e.target.value;loadForYou();refreshCart();};
$("#q").oninput=()=>loadGrid();
loadUsers();loadForYou();loadChips();loadGrid();refreshCart();
</script>
</body>
</html>
